<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Management</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    form, .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    input, select, button { padding: 10px; }
    button { cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    #message { margin: 15px 0; min-height: 20px; }
  </style>
</head>
<body>
  <h1>Customer Management</h1>

  <div class="filters">
    <input id="search" placeholder="Search by name">
    <select id="size">
      <option value="">All sizes</option>
      <option>Small</option>
      <option>Medium</option>
      <option>Enterprise</option>
      <option>Large Enterprise</option>
      <option>Very Large Enterprise</option>
    </select>
    <select id="industry">
      <option value="">All industries</option>
      <option>Logistics</option>
      <option>Retail</option>
      <option>Technology</option>
      <option>HR</option>
      <option>Finance</option>
    </select>
    <button id="filter-button">Filter</button>
  </div>

  <form id="customer-form">
    <input id="name" placeholder="Name" required>
    <input id="email" type="email" placeholder="Email" required>
    <select id="customer-size" required>
      <option value="">Size</option>
      <option>Small</option>
      <option>Medium</option>
      <option>Enterprise</option>
      <option>Large Enterprise</option>
      <option>Very Large Enterprise</option>
    </select>
    <select id="customer-industry" required>
      <option value="">Industry</option>
      <option>Logistics</option>
      <option>Retail</option>
      <option>Technology</option>
      <option>HR</option>
      <option>Finance</option>
    </select>
    <button type="submit">Create customer</button>
  </form>

  <div id="message"></div>

  <table>
    <thead>
      <tr><th>ID</th><th>Name</th><th>Email</th><th>Size</th><th>Industry</th></tr>
    </thead>
    <tbody id="customers"></tbody>
  </table>

  <script>
    async function loadCustomers() {
      const size = document.getElementById('size').value
      const industry = document.getElementById('industry').value
      const params = new URLSearchParams()
      if (size) params.set('size', size)
      if (industry) params.set('industry', industry)

      const response = await fetch(`/customers?${params.toString()}`)
      const data = await response.json()
      const rows = document.getElementById('customers')
      rows.innerHTML = ''

      data.customers.forEach(customer => {
        const tr = document.createElement('tr')
        tr.innerHTML = `
          <td>${customer.id}</td>
          <td>${customer.name}</td>
          <td>${customer.email}</td>
          <td>${customer.size}</td>
          <td>${customer.industry}</td>
        `
        rows.appendChild(tr)
      })
    }

    document.getElementById('filter-button').addEventListener('click', loadCustomers)

    document.getElementById('customer-form').addEventListener('submit', async event => {
      event.preventDefault()

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        size: document.getElementById('customer-size').value,
        industry: document.getElementById('customer-industry').value
      }

      const response = await fetch('/customers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })

      const data = response.status === 204 ? null : await response.json()
      document.getElementById('message').textContent =
        response.ok ? 'Customer created successfully' : data.error

      if (response.ok) {
        event.target.reset()
        await loadCustomers()
      }
    })

    loadCustomers()
  </script>
</body>
</html>
